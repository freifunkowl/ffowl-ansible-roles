---
# Explicit opt-in integration test. Run only against a disposable test agent.
- name: Follow one synthetic login message from each selected agent into the index
  hosts: wazuh_agents
  gather_facts: false
  become: true
  vars:
    indexer: '{{ groups.wazuh_indexers | first }}'
    manager: '{{ wazuh_master_host | default(groups.wazuh_servers | first) }}'
    indexer_address: '{{ hostvars[indexer].wazuh_tls_dns_name if wazuh_indexer_letsencrypt | default(false) | bool else hostvars[indexer].wazuh_node_address | default(hostvars[indexer].ansible_host | default(indexer)) }}'
    state_path: "{{ wazuh_state_dir | default(lookup('env','HOME') ~ '/.local/share/ffowl-wazuh/' ~ (wazuh_cluster_name | default('wazuh'))) }}"
  tasks:
    - name: Run Wazuh verification tasks
      ansible.builtin.import_role:
        name: wazuh
        tasks_from: verify_event
