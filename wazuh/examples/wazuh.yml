---
- name: Form the Wazuh indexer cluster
  hosts: wazuh_indexers
  become: true
  any_errors_fatal: true
  roles:
    - role: wazuh
      wazuh_component: indexer

- name: Configure Wazuh managers and Filebeat
  hosts: wazuh_servers
  become: true
  any_errors_fatal: true
  roles:
    - role: wazuh
      wazuh_component: manager

- name: Connect dashboards to the indexer and manager APIs
  hosts: wazuh_dashboards
  become: true
  any_errors_fatal: true
  roles:
    - role: wazuh
      wazuh_component: dashboard

- name: Register endpoints on the master and connect agents
  hosts: wazuh_agents
  become: true
  roles:
    - role: wazuh
      wazuh_component: agent
